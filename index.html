<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131915" media="(prefers-color-scheme: dark)">
<title>毕业后我继承了一个农场</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<main class="page">
  <header class="head">
    <h1>毕业后我继承了一个农场</h1>
  </header>

  <ol class="log" id="log" aria-live="polite"></ol>

  <section class="ledger" aria-label="库存">
    <div class="row" data-r="fruit" id="row-fruit">
      <span class="name"><i></i>果子</span>
      <span class="val"><b id="v-fruit">0</b><small id="c-fruit"></small></span>
      <span class="rate" id="r-fruit"></span>
      <span class="meter" id="m-fruit"></span>
    </div>
    <div class="row off" data-r="wood" id="row-wood">
      <span class="name"><i></i>木头</span>
      <span class="val"><b id="v-wood">0</b><small id="c-wood"></small></span>
      <span class="rate" id="r-wood"></span>
      <span class="meter" id="m-wood"></span>
    </div>
    <div class="row off" data-r="money" id="row-money">
      <span class="name"><i></i>钱</span>
      <span class="val"><b id="v-money">0</b></span>
      <span class="rate" id="r-money"></span>
    </div>
  </section>

  <section class="acts" aria-label="能做的事">
    <button class="act main" id="b-pick" type="button"><strong>摘果</strong></button>
    <button class="act" id="b-plant" type="button" hidden><strong>种树</strong><span id="s-plant"></span></button>
    <button class="act" id="b-chop" type="button" hidden><strong>砍柴</strong><span>+1 木头</span></button>
    <button class="act" id="b-timber" type="button" hidden><strong>种林木</strong><span id="s-timber"></span></button>
    <button class="act" id="b-expand" type="button" hidden><strong>扩建仓库</strong><span id="s-expand"></span></button>
    <button class="act" id="b-sell" type="button" hidden><strong>卖果</strong><span id="s-sell"></span></button>
  </section>

  <div class="shop" id="shop" hidden>
    <section class="tool" id="card-tech" hidden>
      <h2 class="label" id="l-tech"></h2>
      <div class="what"><strong id="n-tech"></strong><p id="d-tech"></p></div>
      <button id="b-tech" type="button"></button>
    </section>
    <section class="tool" id="card-lux" hidden>
      <h2 class="label" id="l-lux"></h2>
      <div class="what"><strong id="n-lux"></strong><p id="d-lux"></p></div>
      <button id="b-lux" type="button"></button>
    </section>
    <section class="tool" id="card-prod" hidden>
      <h2 class="label" id="l-prod"></h2>
      <div class="what"><strong id="n-prod"></strong><p id="d-prod"></p></div>
      <button id="b-prod" type="button"></button>
    </section>
  </div>

  <section class="buyers" id="buyers" hidden>
    <h2 class="label"><span>买家</span><b id="face"></b></h2>
    <ul id="buyer-list"></ul>
  </section>

  <section class="plot" id="plot" hidden>
    <div class="trees" id="trees"></div>
    <p id="plot-cap"></p>
  </section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
