name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run sim
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: taptap-zip
          path: release/*.zip
